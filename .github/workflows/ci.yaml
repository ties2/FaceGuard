name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff check
        run: ruff check src tests scripts

      - name: Run Ruff format check
        run: ruff format --check src tests scripts

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest

    # Starts a Postgres database for testing
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: ml_serving_db
        ports:
          - 5432:5432
        # Waits until the database is actually ready
        options: >-
          --health-cmd "pg_isready -U admin -d ml_serving_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: ml_serving_db
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      APP_ENV: test
      # run the suite against PostgreSQL in CI (local runs default to SQLite)
      DATABASE_URL: postgresql://admin:secretpassword@localhost:5432/ml_serving_db
      ARTIFACT_STORAGE_BACKEND: local
      LOCAL_ARTIFACT_DIR: /tmp/model_artifacts/

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v --junitxml=reports/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: reports/junit.xml
